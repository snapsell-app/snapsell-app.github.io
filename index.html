<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SnapSell - Snap it. Price it. List it.</title><link rel="stylesheet" href="style.css"></head><body><header><h1>SnapSell</h1><p>Snap it. Price it. List it.</p></header><div class="step"><h2>1. Snap</h2><p class="hint">Take a photo of the item.</p><label class="photo-drop" for="photo">Tap to take a photo or choose one<img id="preview" alt="" style="display:none"></label><input type="file" id="photo" accept="image/*" capture="environment"></div><div class="step"><h2>2. Price</h2><p class="hint">Check sold prices, pick yours.</p><label for="item">What is it? (brand + item, e.g. "Nike graphic tee")</label><input type="text" id="item" placeholder="Nike graphic tee" oninput="buildLinks()"><div class="pricelinks" id="pricelinks" style="display:none"><a id="vintedLink" target="_blank" rel="noopener">Check sold prices on <span>Vinted</span></a><a id="mercariLink" target="_blank" rel="noopener">Check sold prices on <span>Mercari</span></a><a id="ebayLink" target="_blank" rel="noopener">Check sold prices on <span>eBay</span></a></div><label for="price">Your price ($)</label><input type="number" id="price" min="0" step="0.01" placeholder="20"></div><div class="step"><h2>3. List</h2><p class="hint">Details in, listing out.</p><div class="row"><div><label for="brand">Brand</label><input type="text" id="brand" placeholder="Nike"></div><div><label for="size">Size</label><input type="text" id="size" placeholder="M"></div></div><label for="condition">Condition</label><select id="condition"><option>New with tags</option><option>Like new</option><option selected>Great condition</option><option>Good condition</option><option>Fair condition</option></select><label for="notes">Details / flaws (optional)</label><input type="text" id="notes" placeholder="No flaws, rare vintage print"><button class="primary" onclick="makeListing()">Write my listing</button><div id="listingOut"></div><button class="ghost" id="copyBtn" style="display:none" onclick="copyListing()">Copy listing</button></div><footer>SnapSell</footer><script src="app1.js"></script><script src="app2.js"></script><script src="app3.js"></script></body></html>
